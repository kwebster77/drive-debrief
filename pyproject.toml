[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-debrief"
version = "0.1.0"
description = "Turn a recorded practice drive into a coaching debrief (GPS telematics)."
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
drive-debrief = "drive_debrief.cli:main"
drive-debrief-progress = "drive_debrief.progress_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
